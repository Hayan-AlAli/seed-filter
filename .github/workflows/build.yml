name: Build

# Builds every native library and the mod jar from source on GitHub's servers.
# The build is reproducible: the same commit always produces byte-identical files,
# so the SHA-256 sums below can be compared with any jar published on Modrinth.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write      # attach files to GitHub releases (tags only)
  id-token: write      # sign build provenance attestations
  attestations: write

jobs:
  build:
    # Windows, because the C self-test and the Java tests load the windows-x64 library;
    # zig cross-compiles the Linux and macOS libraries from the same machine.
    runs-on: windows-latest
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - uses: gradle/actions/setup-gradle@v4

      - name: Build natives and jar, run C and Java tests
        shell: bash
        run: ./gradlew build

      - name: SHA-256 checksums
        shell: bash
        run: |
          cd build
          sha256sum libs/*.jar native/*/*.dll native/*/*.so native/*/*.dylib | tee SHA256SUMS.txt

      - name: Build provenance attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            build/libs/*.jar
            build/native/*/*.dll
            build/native/*/*.so
            build/native/*/*.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: seedfilter-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/native/*/*.dll
            build/native/*/*.so
            build/native/*/*.dylib
            build/SHA256SUMS.txt

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/*.jar
            build/SHA256SUMS.txt

      - name: Publish to Modrinth
        if: startsWith(github.ref, 'refs/tags/v') && env.MODRINTH_TOKEN != ''
        shell: bash
        run: ./gradlew modrinth
