plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'com.modrinth.minotaur' version '2.10.0'
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation platform("org.junit:junit-bom:5.12.2")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25 }
java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// ---- native (cubiomes + seedfilter.c) ----
def nativeOut = layout.buildDirectory.dir('native').get().asFile
def dll = new File(nativeOut, 'windows-x64/seedfilter.dll') // host library used by the Java tests
def testExe = new File(nativeOut, 'test_seedfilter.exe')
def cubiomesSrc = fileTree('native/cubiomes') {
	include '*.c', 'features/*.c', 'loot/**/*.c'
	exclude 'tests.c'
}
def libSources = ['native/seedfilter.c'] + cubiomesSrc.files.collect { it.path }
def zigFlags = ['-O3', '-target', 'x86_64-windows-gnu', '-mpopcnt']

// one library per platform, all cross-compiled by zig; the mod picks one at runtime (Native.resourceFor)
def nativeTargets = [
	'windows-x64'  : ['x86_64-windows-gnu', 'seedfilter.dll', ['-mpopcnt']],
	'windows-arm64': ['aarch64-windows-gnu', 'seedfilter.dll', []],
	'linux-x64'    : ['x86_64-linux-gnu.2.17', 'libseedfilter.so', ['-mpopcnt', '-fPIC']],
	'linux-arm64'  : ['aarch64-linux-gnu.2.17', 'libseedfilter.so', ['-fPIC']],
	'macos-x64'    : ['x86_64-macos', 'libseedfilter.dylib', ['-mpopcnt', '-Wl,-install_name,libseedfilter.dylib']],
	'macos-arm64'  : ['aarch64-macos', 'libseedfilter.dylib', ['-Wl,-install_name,libseedfilter.dylib']],
]
def nativeTasks = nativeTargets.collect { name, t ->
	def out = new File(nativeOut, "$name/${t[1]}")
	tasks.register("buildNative-$name", Exec) {
		inputs.files(cubiomesSrc, 'native/seedfilter.c', 'native/seedfilter.h')
		outputs.file(out)
		doFirst { out.parentFile.mkdirs() }
		// reproducible: no debug info / PDB, no absolute paths, so CI and local builds are byte-identical
		commandLine(['zig', 'cc', '-shared', '-O3', '-g0', '-s', "-ffile-prefix-map=${projectDir}=.", '-DSF_BUILD_DLL',
				'-target', t[0], *t[2], '-o', out.path, *libSources])
	}
}
// one at a time: parallel zig runs can race while filling a fresh cache (as on a CI machine)
nativeTasks.eachWithIndex { t, i -> if (i > 0) t.configure { mustRunAfter nativeTasks[i - 1] } }
tasks.register('buildNative') { dependsOn nativeTasks }

tasks.register('compileNativeTest', Exec) {
	mustRunAfter nativeTasks
	inputs.files(cubiomesSrc, 'native/seedfilter.c', 'native/seedfilter.h', 'native/test_seedfilter.c')
	outputs.file(testExe)
	doFirst { nativeOut.mkdirs() }
	commandLine(['zig', 'cc', *zigFlags, '-o', testExe.path, 'native/test_seedfilter.c', *libSources])
}

tasks.register('testNative', Exec) {
	dependsOn 'compileNativeTest'
	commandLine testExe.path
}

processResources {
	dependsOn 'buildNative'
	from(nativeOut) {
		into 'natives'
		include '*/*.dll', '*/*.so', '*/*.dylib'
	}
	from('LICENSE')
	from('LICENSE-cubiomes')
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") { expand "version": version }
}

test {
	dependsOn 'buildNative-windows-x64'
	useJUnitPlatform()
	systemProperty 'seedfilter.dll', dll.path
	jvmArgs '--enable-native-access=ALL-UNNAMED'
}

check.dependsOn 'testNative'

// ---- Modrinth (https://modrinth.com/mod/seed-filter) ----
// Upload:       MODRINTH_TOKEN=<token> ./gradlew modrinth
// Dry run:      ./gradlew modrinth -PmodrinthDryRun   (prints the request, uploads nothing)
// Description:  ./gradlew modrinthSyncBody           (README.md becomes the project description)
def changelogFor = { String version ->
	def lines = file('CHANGELOG.md').readLines()
	def start = lines.findIndexOf { it.startsWith("## ${version}") }
	if (start < 0) return "See CHANGELOG.md"
	def end = lines.findIndexOf(start + 1) { it.startsWith('## ') }
	lines.subList(start + 1, end < 0 ? lines.size() : end).join(System.lineSeparator()).trim()
}

modrinth {
	token = System.getenv('MODRINTH_TOKEN')
	projectId = 'seed-filter'
	versionNumber = project.version.toString()
	versionName = "Seed Filter ${project.version}"
	versionType = 'beta'
	uploadFile = tasks.named('jar')
	gameVersions = [project.minecraft_version]
	loaders = ['fabric']
	changelog = changelogFor(project.version.toString())
	syncBodyFrom = file('README.md').text
	debugMode = project.hasProperty('modrinthDryRun')
	dependencies {
		required.project 'fabric-api'
	}
}
